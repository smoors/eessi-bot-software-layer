name: Run tests
on: [push, pull_request]
# Declare default permissions as read only.
permissions: read-all
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Waitress 3.0.1 does not support Python 3.8 or older
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: false
    steps:
      - name: checkout
        uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3.1.0

      - name: set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@13ae5bb136fac2878aff31522b9efb785519f984 # v4.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install required Python packages + pytest + flake8
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r .github/workflows/tests_requirements.txt
          python -m pip install --upgrade flake8

      - name: Run test suite (without coverage)
        run: |
          ./test.sh --verbose

      - name: Run test suite (with coverage)
        run: |
          ./test.sh -q --cov=$PWD

      - name: Run flake8 to verify PEP8-compliance of Python code
        run: |
          flake8
